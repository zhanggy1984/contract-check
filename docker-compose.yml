# ============================================================
# contract-check — 共享 infra 模式（全共享方案，2026-08-25 起）
#
# 本 agent 不自带任何中间件，全部依赖共享 infra：
#   mysql  -> infra 的 MySQL（库 contract_check / 账号 contract）
#   redis  -> 无
#   milvus -> 无
#
# 前置：先部署共享 infra（D:/study/aiprojcet/infra，`docker compose up -d`）。
# 启动：docker compose up -d --build
# 连接：前端 http://localhost:8088 / 后端 http://localhost:8003
# ============================================================

name: contract-check

services:
  backend:
    build: ./backend
    container_name: contract-check-backend
    env_file: ./backend/.env            # DEEPSEEK_API_KEY 等（本地文件，不入镜像）
    environment:
      MYSQL_HOST: mysql                 # 逻辑主机名 → 共享 infra MySQL
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TASK_TIMEOUT_SECONDS: "1800"      # 首次 OCR 模型下载预留，避免误超时
    ports:
      - "8003:8000"                     # 避本地 rag-attu(8001)/gq-backend(8080)
    volumes:
      - upload_data:/app/data/uploads   # 上传原件持久化
      - parsed_data:/app/data/parsed    # 解析文本持久化
    healthcheck:                        # backend 就绪才让 frontend 反代
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 2g                       # OCR+LLM 高内存，限制防拖垮宿主
    restart: unless-stopped
    networks:
      - shared-infra

  frontend:
    build: ./frontend
    container_name: contract-check-frontend
    ports:
      - "8088:80"                       # 避本地 rag-nginx(80)
    healthcheck:                        # 用 127.0.0.1：localhost 在 alpine 解析到 ::1，nginx 只监听 IPv4
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - shared-infra

volumes:
  upload_data:
  parsed_data:

networks:
  shared-infra:
    external: true
    name: shared-infra_shared-infra
