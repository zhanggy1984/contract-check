# nginx 配置（T4.5）：静态资源 + /api 反代 backend
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传大小与后端 max_upload_mb=50 对齐（扫描 PDF 可能数 MB~几十 MB）
    client_max_body_size 50m;

    # M4：gzip 压缩静态资源
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # API 反代到统一网关（api-gateway:8099）：网关按 Host 头路由到 contract-check 后端
    location /api/ {
        proxy_pass http://api-gateway:8099;
        proxy_set_header Host cc.local;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;   # OCR/LLM 任务耗时可能较长
    }

    # vite 构建产物（带 hash，可长缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Vue SPA 路由：index.html 不缓存（发布后即时生效）
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
